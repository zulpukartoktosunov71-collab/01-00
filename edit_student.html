<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <title>Студенттин маалыматын оңдоо</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 30px; background-color: #f4f7f6; }
        .form-card { max-width: 500px; margin: 0 auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .btn { background-color: #087653; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; width: 100%; font-size: 16px; }
        .btn:hover { background-color: #065e43; }
    </style>
</head>
<body>

<div class="form-card">
    <h2>✏️ Студенттин маалыматын оңдоо</h2>
    <form method="POST">
        <div class="form-group">
            <label>Аты-жөнү:</label>
            <input type="text" name="name" value="{{ student['name'] }}" required>
        </div>
        <div class="form-group">
            <label>Тулган жылы:</label>
            <input type="number" name="birth_year" value="{{ student['birth_year'] }}">
        </div>
        <div class="form-group">
            <label>Курсу:</label>
            <select name="course_id" required>
                {% for course in courses %}
                    <option value="{{ course['id'] }}" {% if course['id'] == student['course_id'] %}selected{% endif %}>
                        {{ course['name'] }}
                    </option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>Ата-энесинин аты:</label>
            <input type="text" name="parent_name" value="{{ student['parent_name'] }}">
        </div>
        <div class="form-group">
            <label>Телефон номери:</label>
            <input type="text" name="phone" value="{{ student['phone'] }}">
        </div>
        <button type="submit" class="btn">Сактоо</button>
    </form>
</div>

</body>
</html>
